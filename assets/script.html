<script id="book" type="application/json">__BOOK__</script>
<script id="prerun" type="application/json">__PRERUN__</script>
<script>
(function(){
const B = JSON.parse(document.getElementById('book').textContent);
const AYS = B.meta.ays, NDEV = B.meta.ndev, DL = B.meta.devLabels, DRV = B.meta.drivers;
B.claims.forEach(c=>{ c.incurred=c.paid.map((p,j)=>p+(c.case[j]||0)); });
const CL = Object.fromEntries(B.claims.map(c=>[c.id,c]));
document.getElementById('claimCount').textContent = B.claims.length + ' claims · ' + B.claims.reduce((a,c)=>a+c.notes.length,0) + ' adjuster notes';

// derived ratio triangles (Friedland ch. 6)
const T = B.triangles;
const mk = f => AYS.map((ay,i)=>T.paid[i].map((v,d)=>v==null?null:f(i,d)));
const sdiv=(a,b)=>b?a/b:null;
T.p2r = mk((i,d)=>sdiv(T.paid[i][d],T.incurred[i][d]));
T.disposal = mk((i,d)=>sdiv(T.closed[i][d],T.reported[i][d]));
T.avgpaid = mk((i,d)=>sdiv(T.paid[i][d],T.closed[i][d]));

const TRI = [
  {k:'paid', name:'Paid losses', fmt:money, kind:'cum', dec:true},
  {k:'incurred', name:'Reported losses', note:'paid + case outstanding', fmt:money, kind:'cum', dec:true},
  {k:'reported', name:'Reported counts', fmt:int, kind:'cum'},
  {k:'closed', name:'Closed counts', fmt:int, kind:'cum'},
  {k:'p2r', name:'Paid ÷ reported', note:'settlement speed vs case adequacy', fmt:ratio, kind:'ratio'},
  {k:'disposal', name:'Closed ÷ reported counts', note:'disposal rate', fmt:ratio, kind:'ratio'},
  {k:'avgpaid', name:'Average paid', note:'paid ÷ closed counts', fmt:money, kind:'ratio'},
  {k:'severity', name:'Average reported', note:'reported ÷ reported counts', fmt:money, kind:'ratio'},
  {k:'avgcase', name:'Average case O/S', note:'case ÷ open counts', fmt:money, kind:'ratio'},
];
const TD = Object.fromEntries(TRI.map(t=>[t.k,t]));
function money(v){ return v==null?'':'$'+(Math.abs(v)>=1e6?(v/1e6).toFixed(2)+'M':Math.round(v/1000).toLocaleString()+'k'); }
function moneyFull(v){ return (v<0?'−':'')+'$'+Math.abs(Math.round(v)).toLocaleString(); }
function int(v){ return v==null?'':String(v); }
function ratio(v){ return v==null?'':v.toFixed(3); }
function f4(v){ return v==null?'':v.toFixed(3); }
function pct(v){ return (v>=0?'+':'−')+(Math.abs(v)*100).toFixed(1)+'%'; }
const DNAME = {inflation:'Emerging inflation', large_loss:'Large-loss outlier', recovery:'One-time recovery', speedup:'Settlement speed-up', strengthening:'Case reserve strengthening', slowdown:'Settlement slow-down', residual:'Unexplained residual', routine:'Routine'};
const DKEYS = ['inflation','large_loss','recovery','speedup','strengthening','slowdown'];
const DSHORT = {inflation:'Inflation', large_loss:'Large loss', recovery:'Recovery', speedup:'Speed-up', strengthening:'Strengthening', slowdown:'Slow-down', residual:'Unexplained'};
const DNATURE = {inflation:'recurring: costs per claim are rising and will keep rising', large_loss:'one-off: a single outsize file, handled through the large-loss load', recovery:'one-off: a credit that will not repeat', speedup:'timing only: money paid earlier than the historical pattern, no change in amount', strengthening:'basis change: reserves raised with no new claim information', slowdown:'timing only: payments deferred by a process interruption, caught up later'};
const FLAGNAME = {spike:'Spike', drop:'Drop', hidden:'Hidden volatility'};
function flagClass(f){ return f==='hidden'?'hidden-flag':(f||''); }

const PRE = JSON.parse(document.getElementById('prerun').textContent||'{}');
let state = { tri:'paid', view:'factors', sel:null, ai:{}, log:[] };
try{ const s=localStorage.getItem('aars-log'); if(s) state.log=JSON.parse(s);}catch(e){}

// ---------- lookups ----------
function factorOf(k, i, d){ const r=T[k][i]; if(r[d+1]==null||!r[d]) return null; return r[d+1]/r[d]; }
function baselineOf(k, i, d){ let n=0,m=0; T[k].forEach((r,j)=>{ if(j===i||r[d+1]==null||!r[d]) return; n+=r[d+1]; m+=r[d]; }); return m?n/m:null; }
// level of a ratio triangle at age d vs the simple mean of other AYs at the same age
function levelNorm(k, i, d){ const xs=[]; T[k].forEach((r,j)=>{ if(j!==i&&r[d]!=null) xs.push(r[d]); }); return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null; }
function cellInfo(k,i,d){
  const key=AYS[i]+'-'+d;
  if(B.cells[k] && B.cells[k][key]){ const c=B.cells[k][key]; const parts={}; Object.keys(c.parts).forEach(p=>{ if(Math.abs(c.parts[p])>1e-6) parts[p]=c.parts[p]; }); return Object.assign({},c,{parts}); }
  const obs=factorOf(k,i,d); if(obs==null) return null;
  const base=baselineOf(k,i,d)??obs;
  return {ay:AYS[i],dev:d,observed:obs,baseline:base,parts:{},residual:obs-base,suggested:base,gross:0,flag:null,claims:[],movers:[],derived:true};
}

// ---------- column selection ----------
// adjusted factor for one AY: observed minus the one-off driver contributions found in the notes
function adjFactor(k,i,d){
  const c=cellInfo(k,i,d); if(!c) return null;
  let oneoff=0; const stripped={};
  Object.keys(c.parts).forEach(p=>{ if(!DRV[p].recurring){ oneoff+=c.parts[p]; stripped[p]=c.parts[p]; } });
  return {obs:c.observed, adj:c.observed-oneoff, stripped, parts:c.parts, w:T[k][i][d]};
}
function columnSel(k,d){
  const rows=[]; let n0=0,m0=0,n1=0,m1=0;
  AYS.forEach((ay,i)=>{ const a=adjFactor(k,i,d); if(!a) return; rows.push(Object.assign({ay,i},a)); n0+=a.obs*a.w; m0+=a.w; n1+=a.adj*a.w; m1+=a.w; });
  const last=rows.slice(-5); let n2=0,m2=0; last.forEach(r=>{ n2+=r.adj*r.w; m2+=r.w; });
  return {rows, unadj:m0?n0/m0:null, adj:m1?n1/m1:null, adjLast5:m2?n2/m2:null, simpleAdj:rows.length?rows.reduce((a,r)=>a+r.adj,0)/rows.length:null};
}
function columnWaterfall(k,d,aiLdf){
  const cs=columnSel(k,d); const W=560, L=190, R=90, pw=W-L-R;
  // weighted contribution of each one-off driver to the column average
  const contrib={}; let m=0; cs.rows.forEach(r=>{ m+=r.w; Object.keys(r.stripped).forEach(p=>{ contrib[p]=(contrib[p]||0)+r.stripped[p]*r.w; }); });
  Object.keys(contrib).forEach(p=>contrib[p]=-contrib[p]/m);
  const steps=[{k:'unadj',label:'Unadjusted vol-wtd avg',v:cs.unadj,abs:true}];
  Object.keys(contrib).sort((a,b)=>Math.abs(contrib[b])-Math.abs(contrib[a])).forEach(p=>steps.push({k:p,label:'Strip '+DNAME[p].toLowerCase(),v:contrib[p]}));
  if(!Object.keys(contrib).length) steps.push({k:'residual',label:'Nothing to strip',v:0});
  steps.push({k:'adj',label:'AARS-adjusted LDF',v:cs.adj,abs:true});
  const H=40+steps.length*34+36;
  let lo=Math.min(cs.unadj,cs.adj,aiLdf??cs.adj), hi=Math.max(cs.unadj,cs.adj,aiLdf??cs.adj), run=cs.unadj; steps.slice(1,-1).forEach(st=>{ run+=st.v; lo=Math.min(lo,run); hi=Math.max(hi,run); });
  const pad=(hi-lo)*0.2||0.01; lo-=pad; hi+=pad; const x=v=>L+(v-lo)/(hi-lo)*pw;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Waterfall from the unadjusted column average to the AARS-adjusted factor">`;
  for(let t=0;t<=5;t++){ const v=lo+(hi-lo)*t/5; svg+=`<line x1="${x(v)}" y1="30" x2="${x(v)}" y2="${H-30}" stroke="var(--line)"/><text x="${x(v)}" y="${H-12}" font-size="11" text-anchor="middle" fill="var(--ink-3)" font-family="var(--font-mono)">${v.toFixed(3)}</text>`; }
  run=cs.unadj;
  steps.forEach((st,n)=>{ const y=40+n*34; let x0,x1,col; if(st.abs){ x0=x(lo); x1=x(st.v); col=st.k==='unadj'?'var(--d-baseline)':'var(--accent)'; } else { x0=x(run); run+=st.v; x1=x(run); col=`var(--d-${st.k})`; }
    svg+=`<text x="${L-10}" y="${y+14}" font-size="12" text-anchor="end" fill="var(--ink-2)" font-family="var(--font-body)">${st.label}</text><rect x="${Math.min(x0,x1)}" y="${y}" width="${Math.max(2,Math.abs(x1-x0))}" height="20" rx="3" fill="${col}"/><text x="${Math.max(x0,x1)+8}" y="${y+14}" font-size="12" fill="var(--ink)" font-family="var(--font-mono)">${st.abs?st.v.toFixed(3):(st.v>=0?'+':'−')+Math.abs(st.v).toFixed(3)}</text>`;
    if(n<steps.length-1) svg+=`<line x1="${x1}" y1="${y+20}" x2="${x1}" y2="${y+34}" stroke="var(--line-strong)" stroke-dasharray="2 2"/>`; });
  if(aiLdf!=null){ const xa=x(aiLdf); svg+=`<line x1="${xa}" y1="24" x2="${xa}" y2="${H-30}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/><text x="${xa}" y="18" font-size="11" text-anchor="middle" fill="var(--accent)" font-family="var(--font-display)" font-weight="600">AI recommends ${Number(aiLdf).toFixed(3)}</text>`; }
  return svg+'</svg>';
}
// ---------- column driver map (AY x driver) ----------
function driverMap(k,d){
  const rows=[]; let maxAbs=0.0001;
  AYS.forEach((ay,i)=>{
    const c=cellInfo(k,i,d); if(!c) return;
    const base=T[k][i][d]; const cells={}; DKEYS.forEach(p=>cells[p]={v:0,claims:[]});
    B.claims.forEach(cl=>{ if(cl.ay!==ay) return; cl.events.forEach(e=>{ if(e.dev!==d+1) return; const amt=k==='paid'?e.amt:e.amtInc; if(!amt) return; cells[e.driver].v+=amt/base; const note=(cl.notes.find(n=>n.dev===d+1&&n.driver===e.driver)||{}).text||''; cells[e.driver].claims.push({id:cl.id,amt,note,status:cl.status[d+1]}); }); });
    const explained=DKEYS.reduce((a,p)=>a+cells[p].v,0);
    const resid=c.observed-c.baseline-explained;
    // residual: claims with movement in the period but no tagged event
    const key2=k==='paid'?'paid':'incurred';
    const untagged=B.claims.filter(cl=>cl.ay===ay&&!cl.events.some(e=>e.dev===d+1)).map(cl=>({id:cl.id,amt:(cl[key2][d+1]??0)-(cl[key2][d]??0),note:(cl.notes.find(n=>n.dev===d+1)||{}).text||'',status:cl.status[d+1]})).filter(x=>x.amt).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));
    cells.residual={v:resid,claims:untagged,resid:true};
    Object.values(cells).forEach(x=>{ maxAbs=Math.max(maxAbs,Math.abs(x.v)); });
    rows.push({ay,i,obs:c.observed,base:c.baseline,cells,open:ay===AYS[state.sel?state.sel.i:-1]});
  });
  return {rows,maxAbs};
}
function hmCell(v,maxAbs,n,extra){
  const pctv=Math.min(1,Math.abs(v)/maxAbs); const alpha=Math.round(8+pctv*72);
  const tok=v>0?'--spike':'--drop'; const bg=Math.abs(v)<0.0005?'transparent':`color-mix(in srgb, var(${tok}) ${alpha}%, var(--surface))`;
  const fg=pctv>0.55?'#fff':'var(--ink)';
  return `<td class="hm ${n?'c':''}" style="background:${bg};color:${fg}" ${extra||''}>${Math.abs(v)<0.0005?'<span class="muted">·</span>':((v>=0?'+':'−')+Math.abs(v).toFixed(3))}${n?`<small>${n} claim${n>1?'s':''}</small>`:''}</td>`;
}
function driverMapTable(k,d){
  const dm=driverMap(k,d); const cols=DKEYS.concat(['residual']);
  let h='<div style="overflow-x:auto"><table class="xtri hmap"><thead><tr><th>Acc. year</th><th>Observed</th><th>Norm</th>'+cols.map(p=>`<th title="${DNAME[p]}"><span class="dchip"><i style="background:var(--d-${p})"></i>${DSHORT[p]}</span></th>`).join('')+'</tr></thead><tbody>';
  dm.rows.forEach(r=>{ h+=`<tr class="${r.open?'cur':''}"><td>${r.ay}${r.open?' <span class="muted small">(open)</span>':''}</td><td class="num">${r.obs.toFixed(3)}</td><td class="num muted">${r.base.toFixed(3)}</td>`;
    cols.forEach(p=>{ const x=r.cells[p]; const n=x.claims.length; h+=hmCell(x.v,dm.maxAbs,n,`data-ay="${r.ay}" data-drv="${p}" title="AY ${r.ay} · ${DNAME[p]}: ${(x.v>=0?'+':'−')+Math.abs(x.v).toFixed(4)} of the factor · ${n} claim${n===1?'':'s'}. Click to list them."`); });
    h+='</tr>'; });
  // weighted column total per driver
  let tot={}; cols.forEach(p=>tot[p]=0); let m=0; dm.rows.forEach(r=>{ const w=T[k][r.i][d]; m+=w; cols.forEach(p=>tot[p]+=r.cells[p].v*w); });
  h+='<tr class="avg"><td>Column (vol-wtd)</td><td></td><td></td>'+cols.map(p=>{ const v=m?tot[p]/m:0; return `<td class="num">${Math.abs(v)<0.0005?'·':(v>=0?'+':'−')+Math.abs(v).toFixed(3)}</td>`; }).join('')+'</tr>';
  return h+'</tbody></table></div>';
}
function driverClaims(k,d,ay,drv){
  const dm=driverMap(k,d); const r=dm.rows.find(x=>x.ay===ay); if(!r) return '';
  const x=r.cells[drv]; const base=T[k][r.i][d]; const list=x.claims.slice().sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));
  const totAmt=list.reduce((a,c)=>a+c.amt,0);
  let h=`<div class="hm-detail"><div class="toolbar"><h4>AY ${ay} · ${DNAME[drv]} · ${list.length} claim${list.length===1?'':'s'} · ${(x.v>=0?'+':'−')+Math.abs(x.v).toFixed(3)} of the factor (${moneyFull(totAmt)} on an opening ${money(base)})</h4><button type="button" class="btn quiet" id="hmClose">Close</button></div>`;
  if(x.resid) h+=`<p class="small muted">No tagged driver explains this part of the movement. These are the untagged claims that moved in the period, largest first; if a few of them carry most of it, the residual is concentration rather than a systemic cause.</p>`;
  if(!list.length) return h+'<p class="small muted">No claims.</p></div>';
  h+='<div class="claims">'+list.slice(0,40).map(c=>`<div class="claim"><div class="l1"><span class="id">${c.id}</span><span class="tag" style="background:var(--d-${drv})">${DNAME[drv]}</span><span class="small muted">${c.status||''} · ${Math.round(Math.abs(c.amt)/Math.max(1,Math.abs(totAmt))*100)}% of this cell</span></div><span class="amt">${moneyFull(c.amt)}</span>${c.note?`<div class="note">${c.note}</div>`:''}</div>`).join('')+'</div>';
  if(list.length>40) h+=`<p class="small muted">Showing the 40 largest of ${list.length}.</p>`;
  return h+'</div>';
}
function factorSet(k){
  const out=[]; for(let d=0;d<NDEV-1;d++){ const cs=columnSel(k,d); out.push({d, unadj:cs.unadj, adj:cs.adj}); }
  // cumulative to ultimate (tail 1.000)
  let cu=1, ca=1; for(let d=NDEV-2;d>=0;d--){ cu*= out[d].unadj??1; ca*= out[d].adj??1; out[d].cdfU=cu; out[d].cdfA=ca; }
  return out;
}

// signals for a cell (i,d): development d->d+1
function signals(i,d){
  const dev=(k)=>{ const f=factorOf(k,i,d), b=baselineOf(k,i,d); return (f==null||b==null)?null:(f-b)/b; };
  const lvl=(k)=>{ const v=T[k][i][d+1], n=levelNorm(k,i,d+1); return (v==null||n==null||!n)?null:(v-n)/n; };
  const o=T.open[i]; const fewOpen=(o[d+1]??0)<15;
  return { paid:dev('paid'), rep:dev('incurred'), cnt:dev('reported'), closed:dev('closed'), disp:lvl('disposal'), p2r:lvl('p2r'), avgcase:fewOpen?null:lvl('avgcase'), avgpaid:lvl('avgpaid') };
}
const SIGCOLS=[['paid','Paid'],['rep','Reported'],['cnt','Rep. counts'],['closed','Closed counts'],['p2r','Paid ÷ rep.'],['avgcase','Avg case O/S']];
function dir(v,th){ if(v==null) return '·'; return v>th?'↑':v<-th?'↓':'→'; }
const SIGS=[
  {name:'Severity change: inflation', exp:{paid:'↑',rep:'↑',cnt:'→',closed:'→'}, read:'Costs per claim are rising across many files. Recurring; carry it.'},
  {name:'Severity change: large loss', exp:{paid:'↑',rep:'↑',cnt:'→',closed:'→'}, conc:true, read:'The same shape as inflation, but one or two files carry most of the excess. One-off; treat separately.'},
  {name:'Settlement speed-up', exp:{paid:'↑',rep:'→',closed:'↑',p2r:'↑'}, read:'Money moves earlier, totals do not. Revise the payment pattern, not the ultimate.'},
  {name:'Case reserve strengthening', exp:{paid:'→',rep:'↑',closed:'→',p2r:'↓',avgcase:'↑'}, read:'Reported rises with no paid movement. Restate history to the new adequacy basis (Berquist-Sherman) before using the reported method.'},
  {name:'Settlement slow-down', exp:{paid:'↓',rep:'→',closed:'↓',p2r:'↓'}, read:'Money moves later, totals do not. Expect a catch-up in the following period; adjust the pattern, not the ultimate.'},
  {name:'Reporting change / frequency', exp:{cnt:'↑',rep:'↑'}, read:'More claims, not costlier claims. Check exposure and reporting lag.'},
  {name:'Nothing visible: offsetting or random', exp:{paid:'→',rep:'→',cnt:'→',closed:'→'}, read:'The triangles are quiet. Only the claim notes can say whether that quiet is real.'},
];
function matchSig(sig, c){
  const obs={}; SIGCOLS.forEach(([k])=>obs[k]=dir(sig[k], k==='paid'||k==='rep'?0.05:0.08));
  let best=null;
  const scored=SIGS.map(s=>{ let hit=0,n=0; Object.keys(s.exp).forEach(k=>{ if(obs[k]==='·') return; n++; if(obs[k]===s.exp[k]) hit++; });
    let score=n?hit/n:0;
    if(s.conc){ const top=c.movers&&c.movers.length&&c.incr?Math.abs(c.movers[0].amt)/Math.abs(c.incr):0; if(top<0.35) score*=0.6; }
    else if(s.name.startsWith('Severity change: inflation')){ const top=c.movers&&c.movers.length&&c.incr?Math.abs(c.movers[0].amt)/Math.abs(c.incr):0; if(top>=0.35) score*=0.6; }
    return {s,hit,n,score}; });
  scored.forEach(x=>{ if(!best||x.score>best.score) best=x; });
  return {obs,scored,best};
}

// ---------- feed ----------
function verdict(c, tri){
  const p=c.parts, keys=Object.keys(p);
  if(c.flag==='hidden'){ const pos=keys.filter(k=>p[k]>0).map(k=>`${pct(p[k])} ${DNAME[k].toLowerCase()}`).join(', '); const neg=keys.filter(k=>p[k]<0).map(k=>`${pct(p[k])} ${DNAME[k].toLowerCase()}`).join(', '); return `Net factor looks stable (${f4(c.observed)} vs ${f4(c.baseline)}) but the notes carry ${pos}${neg?` against ${neg}`:''}. Gross movement ${(c.gross*100).toFixed(0)}%.`; }
  if(!keys.length) return `No driver found in the notes. Movement is concentrated in a few claims; treat as random variation unless the pattern repeats.`;
  const tot=keys.reduce((a,k)=>a+Math.abs(p[k]),0);
  const parts=keys.sort((a,b)=>Math.abs(p[b])-Math.abs(p[a])).map(k=>`${Math.round(Math.abs(p[k])/tot*100)}% ${DNAME[k].toLowerCase()}`).join(' + ');
  let extra=''; if(p.speedup&&!p.inflation) extra=' Reported unchanged.'; else if(p.speedup) extra=' Reported barely moves.'; else if(p.strengthening) extra=' Paid unchanged.';
  return `${f4(c.observed)} against a column norm of ${f4(c.baseline)}: ${parts}.${extra}`;
}
function renderFeed(){
  const el=document.getElementById('feed'); el.innerHTML='';
  const items=[];
  AYS.forEach((ay,i)=>{ const nd=2025-ay+1; if(nd<2) return; const d=nd-2;
    const cp=B.cells.paid[ay+'-'+d]; if(cp&&cp.flag) items.push({c:cp,tri:'paid'});
    const ci=B.cells.incurred[ay+'-'+d]; if(ci&&ci.flag&&Object.keys(ci.parts).some(k=>Math.abs(ci.parts[k])>1e-6)&&!(cp&&cp.flag)) items.push({c:ci,tri:'incurred'}); });
  items.sort((a,b)=>b.c.ay-a.c.ay);
  items.forEach(({c,tri})=>{
    const cc=cellInfo(tri,AYS.indexOf(c.ay),c.dev);
    const b=document.createElement('button'); b.type='button'; b.className='card '+flagClass(c.flag);
    b.setAttribute('aria-pressed', state.sel&&state.sel.i===AYS.indexOf(c.ay)&&state.sel.d===c.dev&&state.tri===tri ? 'true':'false');
    b.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="cell">AY ${c.ay} · ${DL[c.dev]}→${DL[c.dev+1]} mo</span><span class="chip ${flagClass(c.flag)}">${FLAGNAME[c.flag]}</span></div>
      <div class="num">${f4(c.observed)} <span class="muted">vs ${f4(c.baseline)} · ${TD[tri].name.toLowerCase()} · z ${Math.abs(c.z)>10?(c.z>0?'> +10':'< −10'):(c.z>=0?'+':'')+c.z}</span></div>
      <div class="verdict">${verdict(cc,tri)}</div>`;
    b.onclick=()=>{ state.tri=tri; select(AYS.indexOf(c.ay), c.dev); };
    el.appendChild(b);
  });
}

// ---------- diagonal test ----------
function renderDiag(){
  const cols=[['paid','Paid factor','dev'],['incurred','Reported factor','dev'],['closed','Closed-count factor','dev'],['reported','Rep.-count factor','dev'],['p2r','Paid ÷ reported','lvl'],['disposal','Disposal rate','lvl'],['avgcase','Avg case O/S','lvl']];
  let h='<thead><tr><th>Acc. year</th><th>Period</th>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  AYS.slice().reverse().forEach(ay=>{ const i=AYS.indexOf(ay); const nd=2025-ay+1; if(nd<2) return; const d=nd-2; const sg=signals(i,d);
    h+=`<tr><td>${ay}</td><td class="muted">${DL[d]}→${DL[d+1]}</td>`;
    cols.forEach(([k,,m])=>{ let v; if(m==='dev'){ const f=factorOf(k,i,d), b=baselineOf(k,i,d); v=(f==null||b==null)?null:(f-b)/b; } else { v=k==='avgcase'?sg.avgcase:(()=>{ const x=T[k][i][d+1], n=levelNorm(k,i,d+1); return (x==null||!n)?null:(x-n)/n; })(); }
      if(v==null){ h+='<td class="na">·</td>'; return; }
      const th=(k==='paid'||k==='incurred')?0.05:0.08; const cls=v>th?'up':v<-th?'dn':'';
      const tri=(k==='incurred')?'incurred':(k==='paid'?'paid':(['closed','reported'].includes(k)?k:'paid'));

// ---------- drill ----------
function select(i,d){ state.sel={i,d}; renderAll(); document.getElementById('drill').scrollIntoView({behavior:'smooth',block:'start'}); }
function activeClaims(i,d,tri){
  const ay=AYS[i]; const k=(tri==='incurred')?'incurred':'paid';
  return B.claims.filter(c=>c.ay===ay).map(c=>{
    const inc=(c[k][d+1]??0)-(c[k][d]??0);
    const ev=c.events.filter(e=>e.dev===d+1);
    const notes=c.notes.filter(n=>n.dev===d+1);
    const driver=ev.length?ev[0].driver:'routine';
    const reported=c.r===d+1, closed=c.c===d+1;
    return {c,inc,driver,notes,reported,closed};
  }).filter(x=>x.inc!==0||x.notes.length||x.reported||x.closed).sort((a,b)=>Math.abs(b.inc)-Math.abs(a.inc));
}
function waterfall(c){
  const steps=[{k:'baseline',label:'Column baseline',v:c.baseline,abs:true}];
  Object.keys(c.parts).sort((a,b)=>Math.abs(c.parts[b])-Math.abs(c.parts[a])).forEach(k=>steps.push({k,label:DNAME[k],v:c.parts[k]}));
  steps.push({k:'residual',label:'Residual',v:c.residual});
  steps.push({k:'observed',label:'Observed factor',v:c.observed,abs:true});
  const W=560,H=40+steps.length*34+36, L=190,R=80, pw=W-L-R;
  let lo=Math.min(c.baseline,c.observed,c.suggested), hi=Math.max(c.baseline,c.observed,c.suggested), run=c.baseline;
  steps.slice(1,-1).forEach(s=>{ run+=s.v; lo=Math.min(lo,run); hi=Math.max(hi,run); });
  const pad=(hi-lo)*0.15||0.02; lo-=pad; hi+=pad;
  const x=v=>L+(v-lo)/(hi-lo)*pw;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Waterfall decomposition of the development factor">`;
  const ticks=5; for(let t=0;t<=ticks;t++){ const v=lo+(hi-lo)*t/ticks; svg+=`<line x1="${x(v)}" y1="30" x2="${x(v)}" y2="${H-30}" stroke="var(--line)" stroke-width="1"/><text x="${x(v)}" y="${H-12}" font-size="11" text-anchor="middle" fill="var(--ink-3)" font-family="var(--font-mono)">${v.toFixed(2)}</text>`; }
  run=c.baseline;
  steps.forEach((s,n)=>{
    const y=40+n*34; let x0,x1,col;
    if(s.abs){ x0=x(lo); x1=x(s.v); col=s.k==='baseline'?'var(--d-baseline)':'var(--accent)'; }
    else { x0=x(run); run+=s.v; x1=x(run); col=`var(--d-${s.k})`; }
    const xa=Math.min(x0,x1), w=Math.max(2,Math.abs(x1-x0));
    svg+=`<text x="${L-10}" y="${y+14}" font-size="12" text-anchor="end" fill="var(--ink-2)" font-family="var(--font-body)">${s.label}</text>`;
    svg+=`<rect x="${xa}" y="${y}" width="${w}" height="20" rx="3" fill="${col}" ${s.k==='residual'?'opacity=".7"':''}/>`;
    const lbl=s.abs?s.v.toFixed(3):(s.v>=0?'+':'−')+Math.abs(s.v).toFixed(3);
    svg+=`<text x="${Math.max(x0,x1)+8}" y="${y+14}" font-size="12" fill="var(--ink)" font-family="var(--font-mono)">${lbl}</text>`;
    if(n<steps.length-1){ svg+=`<line x1="${x1}" y1="${y+20}" x2="${x1}" y2="${y+34}" stroke="var(--line-strong)" stroke-dasharray="2 2"/>`; }
  });
  const xs=x(c.suggested);
  svg+=`<line x1="${xs}" y1="24" x2="${xs}" y2="${H-30}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/><text x="${xs}" y="18" font-size="11" text-anchor="middle" fill="var(--accent)" font-family="var(--font-display)" font-weight="600">suggested ${c.suggested.toFixed(3)}</text>`;

}
function reading(c, act, tri){
  const p=c.parts; const out=[]; const ay=c.ay, span=`${DL[c.dev]}→${DL[c.dev+1]} months`; const tn=TD[tri].name.toLowerCase();
  const keys=Object.keys(p).sort((a,b)=>Math.abs(p[b])-Math.abs(p[a]));
  const nOf=k=>act.filter(x=>x.driver===k).length;
  const sg=signals(AYS.indexOf(ay),c.dev); const m=matchSig(sg,c); const best=m.best&&m.best.score>0?m.best.s.name:null;
  const dev=c.observed-c.baseline;
  // 1. what the triangle shows
  if(c.flag==='hidden') out.push(`<p>The ${tn} factor for AY ${ay} at ${span} is ${f4(c.observed)}, within range of the clean norm of ${f4(c.baseline)}. Read from the triangle alone this cell is unremarkable${best?`; the cross-read says "${best.toLowerCase()}"`:''}.</p>`);
  else out.push(`<p>The ${tn} factor for AY ${ay} at ${span} is ${f4(c.observed)} against a clean norm of ${f4(c.baseline)} (${pct(dev/c.baseline)}).${best?` The other triangles match the signature of ${best.toLowerCase()}.`:''}</p>`);
  // 2. what the notes attribute
  if(keys.length){
    const items=keys.map(k=>`${DNAME[k].toLowerCase()} ${pct(p[k])} on ${nOf(k)} file${nOf(k)===1?'':'s'} (${DNATURE[k]})`);
    out.push(`<p>The notes attribute the movement to ${items.join('; ')}. ${Math.abs(c.residual)>=0.02?`A residual of ${pct(c.residual)} is not explained by any note${c.movers&&c.movers.length?`; the largest untagged movers are ${c.movers.slice(0,2).map(x=>x.id).join(' and ')}`:''}.`:'The residual is small, so the notes account for the cell.'}</p>`);
    if(c.flag==='hidden') out.push(`<p>Gross movement is ${(c.gross*100).toFixed(0)}% against a net of ${pct(dev)}: offsetting drivers are cancelling in the net factor, which is the case Friedland warns about when a stable ratio hides change.</p>`);
  } else {
    const top=c.movers.slice(0,3), share=c.incr?top.reduce((a,x)=>a+x.amt,0)/c.incr:0;

  else if(rec.length) carry+=`Carry the recurring ${rec.map(k=>DNAME[k].toLowerCase()).join(', ')} on top of the clean norm; expect the same signal in other open accident years.`;
  else if(one.length) carry+=`Strip the one-off movements (${one.map(k=>DNAME[k].toLowerCase()).join(', ')}) and carry the clean norm.`;
  else carry+=`Carry the clean norm and re-check the cell at the next valuation.`;

  if(p.strengthening) carry+=` Reserves set on the new adequacy basis will develop less than history suggests: restate prior case reserves to the current level before selecting reported factors.`;
  out.push(`<p>${carry}</p>`);
  return out.join('');
}

function sigTable(i,d,c){

      return `<tr class="${cur?'cur':''}"><td>${r.ay}${cur?' <span class="muted small">(open)</span>':''}</td><td class="num">${r.obs.toFixed(3)}</td><td>${strip.length?strip.map(p=>`<span class="dchip"><i style="background:var(--d-${p})"></i>${DNAME[p]} ${pct(r.stripped[p])}</span>`).join(' '):'<span class="muted small">none</span>'}</td><td class="num"><strong>${r.adj.toFixed(3)}</strong></td><td class="num muted">${money(r.w)}</td></tr>`; }).join('');
    h+=`<section><div class="sec-head"><span class="eyebrow">Step ④ · column selection</span><h3>Selecting the ${DL[d]}→${DL[d+1]} factor for the ${TD[triK].name.toLowerCase()} triangle</h3>
        <p class="small muted">One factor is carried per column. Each accident year's observed factor is adjusted by removing the one-off movements the notes identified; recurring inflation stays in. The selection is the volume-weighted average of the adjusted factors.</p></div>
      <div class="two"><div class="stack"><h4>Accident years in this column</h4><div style="overflow-x:auto"><table class="xtri colsel"><thead><tr><th>Acc. year</th><th>Observed</th><th style="text-align:left">Stripped (one-off)</th><th>Adjusted</th><th>Weight</th></tr></thead><tbody>${rowsH}</tbody>
        <tfoot><tr><td>Vol-wtd avg, unadjusted</td><td class="num">${cs.unadj.toFixed(3)}</td><td></td><td></td><td></td></tr>
        <tr class="selrow"><td><strong>Vol-wtd avg, adjusted</strong></td><td></td><td class="small muted">${pct((cs.adj-cs.unadj)/cs.unadj)} vs unadjusted</td><td class="num"><strong>${cs.adj.toFixed(3)}</strong></td><td></td></tr>
        <tr><td>Adjusted, last 5 years</td><td></td><td></td><td class="num">${cs.adjLast5==null?'·':cs.adjLast5.toFixed(3)}</td><td></td></tr>
        <tr><td>Adjusted, simple average</td><td></td><td></td><td class="num">${cs.simpleAdj==null?'·':cs.simpleAdj.toFixed(3)}</td><td></td></tr></tfoot></table></div></div>
      <div class="stack"><h4>From unadjusted average to AARS-adjusted LDF</h4>${columnWaterfall(triK,d,cai&&cai.suggested_ldf?Number(cai.suggested_ldf):null)}<div class="stats"><div class="stat"><span class="eyebrow">Unadjusted</span><span class="v">${cs.unadj.toFixed(3)}</span></div><div class="stat"><span class="eyebrow">AARS-adjusted</span><span class="v sugg">${cs.adj.toFixed(3)}</span></div>${cai&&cai.suggested_ldf?`<div class="stat"><span class="eyebrow">AI recommends</span><span class="v">${Number(cai.suggested_ldf).toFixed(3)}</span></div>`:''}</div></div></div>
      <div class="stack"><h4>Who is driving each year: claims by driver across the column</h4>
        <p class="small muted">Each cell is a driver's contribution to that accident year's factor, in factor points, with the number of claims behind it. Amber adds to the factor, blue reduces it; the last column is what the notes did not explain. Click a cell to list its claims.</p>
        ${driverMapTable(triK,d)}<div id="hmDetail">${state.hm&&state.hm.k===triK&&state.hm.d===d?driverClaims(triK,d,state.hm.ay,state.hm.drv):''}</div></div>
      <div class="two"><div class="stack ai"><div class="ai-bar"><h4>AI column memo</h4><div style="display:flex;gap:8px"><button type="button" class="btn ghost" id="colAiBtn">Write column memo</button><button type="button" class="btn quiet" id="colAiStop" hidden>Stop</button></div></div>
        <div class="ai-out" id="colAiOut">${cai?renderColAI(cai):'<p class="status" id="colAiStatus">Not run yet for this column.</p>'}</div></div>
        <div class="stack decision"><h4>Column factor to carry</h4><fieldset>
          <label><input type="radio" name="cbasis" value="adjusted" checked> AARS-adjusted ${cs.adj.toFixed(3)}</label>
          <label><input type="radio" name="cbasis" value="unadjusted"> Unadjusted ${cs.unadj.toFixed(3)}</label>
          ${cai&&cai.suggested_ldf?`<label><input type="radio" name="cbasis" value="ai"> AI recommendation ${Number(cai.suggested_ldf).toFixed(3)}</label>`:''}
          <label><input type="radio" name="cbasis" value="override"> Override <input type="number" step="0.001" id="covr" value="${cs.adj.toFixed(3)}" aria-label="Override column factor"></label></fieldset>
          <textarea id="crationale" placeholder="Rationale for the column selection"></textarea>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="crecBtn">Record column selection</button><span class="toast" id="crecToast"></span></div></div>
      </div></section>`; }
  h+=`<section class="ai"><div class="ai-bar"><div class="sec-head"><span class="eyebrow">Step ③ · AI reading</span><h3>Read the notes with AI</h3><p class="small muted">Sends the ${act.reduce((a,x)=>a+x.notes.length,0)} notes dated to this period to Claude, which classifies each one to a driver and writes a short reserving memo. Classifications are then compared with the book's own tags.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="aiBtn">Read notes</button><button type="button" class="btn quiet" id="aiStop" hidden>Stop</button></div></div>
    <div class="ai-out" id="aiOut">${ai?renderAI(ai,act):'<p class="status" id="aiStatus">Not run yet for this cell.</p>'}</div></section>`;
  h+=`<section><div class="toolbar"><div class="sec-head"><span class="eyebrow">Evidence</span><h3>Claims behind the cell</h3></div><div class="filters"><label><input type="checkbox" id="fltDrivers" ${state.fltDrivers?'checked':''}> Tagged drivers only</label></div></div><div class="claims" id="claimList"></div></section>`;
  const prev=state.log.find(l=>l.key===key);
  h+=`<section><div class="sec-head"><span class="eyebrow">Step ⑥ · decision</span><h3>Record the cell decision</h3></div><div class="decision">
    <fieldset><legend class="eyebrow" style="margin-bottom:6px">${TD[triK].name} factor to carry for AY ${ay} ${span}</legend>
      <label><input type="radio" name="basis" value="suggested" id="bSugg" checked> Accept suggested ${f4(c.suggested)}</label>
      <label><input type="radio" name="basis" value="observed" id="bObs"> Keep observed ${f4(c.observed)}</label>
      <label><input type="radio" name="basis" value="baseline" id="bBase"> Carry column norm ${f4(c.baseline)}</label>
      <label><input type="radio" name="basis" value="override" id="bOvr"> Override <input type="number" step="0.001" id="ovr" value="${c.suggested.toFixed(3)}" aria-label="Override factor"></label>
    </fieldset>
    <textarea id="rationale" placeholder="Rationale for the file (what the notes showed, what was stripped, what is carried)">${prev?prev.rationale:''}</textarea>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="recBtn">Record decision</button><span class="toast" id="recToast">${prev?'A decision is already on file for this cell; recording again replaces it.':''}</span></div></div></section>`;
  el.innerHTML=h;
  renderClaims(act, ai);
  document.getElementById('fltDrivers').onchange=e=>{ state.fltDrivers=e.target.checked; renderClaims(act, state.ai[key]||PRE[key]); };
  document.getElementById('recBtn').onclick=()=>{
    const basis=el.querySelector('input[name=basis]:checked').value;
    const carried=basis==='suggested'?c.suggested:basis==='observed'?c.observed:basis==='baseline'?c.baseline:parseFloat(document.getElementById('ovr').value)||c.observed;
    const entry={key,cell:`AY ${ay} ${span}`,tri:TD[triK].name,observed:c.observed,suggested:c.suggested,carried,basis,rationale:document.getElementById('rationale').value.trim(),at:new Date().toISOString()};
    state.log=state.log.filter(l=>l.key!==key).concat([entry]);
    try{localStorage.setItem('aars-log',JSON.stringify(state.log));}catch(e){}
    renderLog(); document.getElementById('recToast').textContent='Recorded.';
  };
  wireAI(act, c, key, ay, d, TD[triK]);
  wireColumn(triK, d, i);
}
function renderColAI(ai){
  const badge = ai.pre?`<span class="chip ok" title="Memo produced by Claude on ${ai.ranAt} and stored in the page">Pre-run ${ai.ranAt}</span>`:'<span class="chip ok">Live</span>';
  return `<div class="agree">${badge}${ai.suggested_ldf?`<span class="small">AI recommends <span class="num">${Number(ai.suggested_ldf).toFixed(3)}</span>${ai.basis?` · ${ai.basis}`:''}</span>`:''}</div><pre>${(ai.memo||'').replace(/</g,'&lt;')}</pre>`;
}
function columnPrompt(triK,d){
  const cs=columnSel(triK,d);
  const rows=cs.rows.map(r=>({ay:r.ay, observed:+r.obs.toFixed(4), adjusted:+r.adj.toFixed(4), weight:Math.round(r.w), drivers:Object.fromEntries(Object.entries(r.parts).map(([k,v])=>[k,+v.toFixed(4)]))}));
  return `You are a P&C reserving actuary's assistant selecting one age-to-age development factor for a column of a loss triangle.

Column: ${DL[d]} to ${DL[d+1]} months, ${TD[triK].name} triangle, Commercial Auto Liability, valued 31 Dec 2025.
For each accident year: the observed factor, the factor after removing one-off driver movements identified in the adjuster notes (large losses, recoveries, settlement timing, case-reserve basis changes), the opening volume used as weight, and the driver contributions found (positive or negative additions to the factor). Recurring inflation is deliberately kept in the adjusted factors.
Volume-weighted average unadjusted ${cs.unadj.toFixed(4)}; adjusted ${cs.adj.toFixed(4)}; adjusted last five years ${cs.adjLast5==null?'n/a':cs.adjLast5.toFixed(4)}; adjusted simple average ${cs.simpleAdj==null?'n/a':cs.simpleAdj.toFixed(4)}.

Rows (JSON): ${JSON.stringify(rows)}

Reply with only a JSON object: {"suggested_ldf": <number>, "basis": "<which average or judgement, <=8 words>", "memo": "<=150 words: which years carry one-off movements and what was stripped, whether a recurring driver is present and should be carried forward, which average you would select and why, and what to watch at the next valuation. Plain sentences, no bullet points."}`;
}
function wireColumn(triK,d,i){
  document.querySelectorAll('table.hmap td.c').forEach(td=>td.onclick=()=>{ state.hm={k:triK,d,ay:+td.dataset.ay,drv:td.dataset.drv}; const box=document.getElementById('hmDetail'); box.innerHTML=driverClaims(triK,d,state.hm.ay,state.hm.drv); document.querySelectorAll('table.hmap td.c').forEach(x=>x.classList.toggle('sel',x===td)); const cl=document.getElementById('hmClose'); if(cl) cl.onclick=()=>{ state.hm=null; box.innerHTML=''; document.querySelectorAll('table.hmap td.c').forEach(x=>x.classList.remove('sel')); }; });
  const cl0=document.getElementById('hmClose'); if(cl0) cl0.onclick=()=>{ state.hm=null; document.getElementById('hmDetail').innerHTML=''; document.querySelectorAll('table.hmap td.c').forEach(x=>x.classList.remove('sel')); };
  const ckey='col:'+triK+':'+d; const btn=document.getElementById('colAiBtn'), stop=document.getElementById('colAiStop'), out=document.getElementById('colAiOut'); if(!btn) return;
  getSample().then(s=>{ if(!s){ btn.disabled=true; btn.textContent=PRE[ckey]?'Pre-run memo shown':'AI memo unavailable here'; } else if(PRE[ckey]&&!state.ai[ckey]) btn.textContent='Write column memo live'; });
  let ctl=null; stop.onclick=()=>ctl&&ctl.abort();
  btn.onclick=async()=>{ const sample=await getSample(); if(!sample) return; let permanent=false; ctl=new AbortController(); btn.disabled=true; stop.hidden=false; out.innerHTML='<p class="status">Thinking…</p>';
    try{ const res=await sample.json(columnPrompt(triK,d),{signal:ctl.signal, modelTier:'default'}); state.ai[ckey]={memo:String(res.memo||''),suggested_ldf:res.suggested_ldf,basis:res.basis}; renderAll(); }
    catch(e){ const code=e&&e.code; let msg; if(code==='cancelled') msg='Stopped.'; else if(['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(code)){ msg='AI memo is not available for this viewer.'; permanent=true; } else if(code==='rate_limited') msg='Too many requests right now. Try again in a minute.'; else msg='The memo failed ('+(code||'error')+'). Try again.'; out.innerHTML='<p class="status">'+msg+'</p>'; }
    finally{ if(!permanent) btn.disabled=false; stop.hidden=true; } };
  const rec=document.getElementById('crecBtn'); if(!rec) return;
  rec.onclick=()=>{ const cs=columnSel(triK,d); const cai=state.ai[ckey]||PRE[ckey]; const basis=document.querySelector('input[name=cbasis]:checked').value;
    const carried=basis==='adjusted'?cs.adj:basis==='unadjusted'?cs.unadj:basis==='ai'?Number(cai.suggested_ldf):(parseFloat(document.getElementById('covr').value)||cs.adj);
    const entry={key:ckey,cell:`Column ${DL[d]}→${DL[d+1]}`,tri:TD[triK].name,observed:cs.unadj,suggested:cs.adj,carried,basis:'column · '+basis,rationale:document.getElementById('crationale').value.trim(),at:new Date().toISOString()};
    state.log=state.log.filter(l=>l.key!==ckey).concat([entry]); try{localStorage.setItem('aars-log',JSON.stringify(state.log));}catch(e){} renderLog(); document.getElementById('crecToast').textContent='Recorded.'; };
}
function renderClaims(act, ai){
  const list=document.getElementById('claimList'); if(!list) return;
  const rows=act.filter(x=>!state.fltDrivers||x.driver!=='routine');
  if(!rows.length){ list.innerHTML='<div class="claim"><span class="muted">No claims match.</span></div>'; return; }
  list.innerHTML=rows.map(x=>{
    const aiTag=ai&&ai.byId?ai.byId[x.c.id]:null;
    const tag=x.driver==='routine'?'<span class="tag routine">routine</span>':`<span class="tag" style="background:var(--d-${x.driver})">${DNAME[x.driver]}</span>`;
    const aiChip=aiTag?`<span class="dchip" title="AI classification"><i style="background:var(--d-${DKEYS.includes(aiTag.driver)?aiTag.driver:'residual'})"></i>AI: ${DNAME[aiTag.driver]||aiTag.driver}${aiTag.driver===x.driver?' ✓':' ✗'}</span>`:'';
    const facts=`${x.c.state} · ${x.c.injury} · ${x.c.litigated?'litigated':'not litigated'} · ${x.closed?'closed this period':x.reported?'reported this period':'open'}`;
    const notes=x.notes.length?`<details><summary>${x.notes.length} note${x.notes.length>1?'s':''} · ${x.c.adjuster}</summary>${x.notes.map(n=>`<p class="note" style="margin-top:6px">${n.text}</p>`).join('')}${aiTag&&aiTag.why?`<p class="note ai" style="margin-top:6px">AI: ${aiTag.why}</p>`:''}</details>`:'<span class="small muted">No note this period</span>';
    return `<div class="claim"><div class="l1"><span class="id">${x.c.id}</span>${tag}${aiChip}<span class="small muted">${facts}</span></div><span class="amt">${moneyFull(x.inc)}</span><div class="note">${notes}</div></div>`;
  }).join('');
}
function renderAI(ai, act){
  if(ai.error) return `<p class="status">${ai.error}</p>`;
  const tagged=act.filter(x=>x.notes.length);
  let agree=0, n=0; tagged.forEach(x=>{ const a=ai.byId[x.c.id]; if(!a) return; n++; if(a.driver===x.driver) agree++; });
  const sysText = ai.systemic===true?'Systemic driver present':ai.systemic===false?'No systemic driver':'';
  const badge = ai.pre?`<span class="chip ok" title="Reading produced by Claude on ${ai.ranAt} and stored in the page">Pre-run ${ai.ranAt}</span>`:'<span class="chip ok">Live reading</span>';
  return `<div class="agree">${badge}<span class="eyebrow">Agreement with book tags</span><span class="num">${n?Math.round(agree/n*100):0}% (${agree}/${n})</span><span class="meter"><i style="width:${n?agree/n*100:0}%"></i></span>${sysText?`<span class="chip ok">${sysText}</span>`:''}${ai.suggested_ldf?`<span class="small">AI suggests <span class="num">${Number(ai.suggested_ldf).toFixed(3)}</span> · ${ai.treatment||''}</span>`:''}</div>
    <pre>${(ai.memo||'').replace(/</g,'&lt;')}</pre>${ai.truncated?'<p class="status">Answer was cut short.</p>':''}`;
}
let samplePromise=null;
function getSample(){ if(!samplePromise) samplePromise=(window.claude&&claude.use)?claude.use('sample').catch(()=>null):Promise.resolve(null); return samplePromise; }
function wireAI(act, c, key, ay, d, tdef){
  const btn=document.getElementById('aiBtn'), stop=document.getElementById('aiStop'), out=document.getElementById('aiOut');
  getSample().then(s=>{ if(!s){ btn.disabled=true; btn.textContent=PRE[key]?'Pre-run reading shown':'AI reading unavailable here'; const st=document.getElementById('aiStatus'); if(st) st.textContent='Live reading runs only inside Claude. Cells on the diagnostic feed carry a stored reading.'; } else if(PRE[key]&&!state.ai[key]){ btn.textContent='Read notes live'; } });
  let ctl=null;
  stop.onclick=()=>ctl&&ctl.abort();
  btn.onclick=async()=>{
    const sample=await getSample(); if(!sample) return;
    const notes=[]; act.forEach(x=>x.notes.forEach(n=>notes.push({id:x.c.id, movement:Math.round(x.inc), note:n.text})));
    const slice=notes.slice(0,60);
    const sg=signals(AYS.indexOf(ay),d);
    const prompt=`You are a P&C reserving actuary's assistant. Below are adjuster notes written during one development period of a loss triangle cell. Classify each note to exactly one driver, then write a short reserving memo.

Cell: accident year ${ay}, development ${DL[d]} to ${DL[d+1]} months, ${tdef.name} triangle, Commercial Auto Liability.
Observed age-to-age factor ${c.observed.toFixed(3)}; volume-weighted norm for this column across other accident years ${c.baseline.toFixed(3)}.
Cross-triangle signals for the same cell (deviation from column norm): paid factor ${sg.paid==null?'n/a':pct(sg.paid)}, reported factor ${sg.rep==null?'n/a':pct(sg.rep)}, closed-count factor ${sg.closed==null?'n/a':pct(sg.closed)}, reported-count factor ${sg.cnt==null?'n/a':pct(sg.cnt)}, paid-to-reported ratio ${sg.p2r==null?'n/a':pct(sg.p2r)}, average case outstanding ${sg.avgcase==null?'n/a':pct(sg.avgcase)}.

Driver codes:
- "inflation": medical, repair, wage or settlement cost levels rising; demands anchored to recent verdicts; fee schedules above those priced. Recurring and systemic.
- "large_loss": a single outsize verdict or catastrophic loss paid at or near limits. One-off.
- "recovery": subrogation, salvage or other one-time credit reducing paid loss. One-off.
- "speedup": settlement made earlier than the historical pattern (fast-track, early-resolution programme) with no change to the amount. Timing only.
- "strengthening": case reserve raised because of a reserve adequacy review or new reserving guideline, with no new information on the claim. Change of basis, not of expected cost.
- "slowdown": payment deferred by a process interruption (court closures, backlog) with the amount unchanged, or the later catch-up of such a deferral. Timing only.
- "routine": ordinary claim handling with no cost-level signal.

Notes (JSON): ${JSON.stringify(slice)}

Reply with only a JSON object of this shape:
{"notes":[{"id":"CA-...","driver":"inflation|large_loss|recovery|speedup|strengthening|slowdown|routine","why":"<=12 words"}],
 "systemic": true|false,
 "treatment": "accept observed|strip one-offs|adjust pattern|restate case reserves|investigate",
 "suggested_ldf": <number>,
 "memo": "<=140 words: what is driving the factor, whether the cross-triangle signals agree with the notes, what is recurring versus one-off, what factor to carry and why. Plain sentences, no bullet points."}
Use one entry per note (same id may repeat). Keep "why" short.`;
    let permanent=false; ctl=new AbortController(); btn.disabled=true; stop.hidden=false;
    out.innerHTML='<p class="status">Thinking… reading '+slice.length+' notes</p><pre id="aiStream"></pre>';
    try{
      const res=await sample.json(prompt,{signal:ctl.signal, modelTier:'default', onText:({text})=>{ const p=document.getElementById('aiStream'); if(p) p.textContent=text.slice(-600); }});
      const byId={}; (res.notes||[]).forEach(n=>{ if(!n||!n.id) return; const dr=String(n.driver||'routine'); if(!byId[n.id]||(byId[n.id].driver==='routine'&&dr!=='routine')) byId[n.id]={driver:dr,why:String(n.why||'')}; });
      state.ai[key]={byId, memo:String(res.memo||''), systemic:res.systemic, treatment:res.treatment, suggested_ldf:res.suggested_ldf};
      out.innerHTML=renderAI(state.ai[key], act); renderClaims(act, state.ai[key]);
    }catch(e){
      const code=e&&e.code; let msg;
      if(code==='cancelled') msg='Stopped.';
      else if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled') { msg='AI reading is not available for this viewer.'; permanent=true; }
      else if(code==='rate_limited') msg='Too many requests right now. Try again in a minute.';
      else if(code==='invalid_json') msg='The reply could not be parsed. Try again.';
      else if(code==='refused') msg='The request was declined.';
      else msg='The reading failed ('+(code||'error')+'). Try again.';
      out.innerHTML='<p class="status">'+msg+'</p>';
    } finally { if(!permanent) btn.disabled=false; stop.hidden=true; if(state.ai[key]) btn.textContent='Read notes again'; }
  };
}
function renderLog(){
  const tb=document.querySelector('#log tbody');
  if(!state.log.length){ tb.innerHTML='<tr><td colspan="7" class="muted">No decisions recorded yet. Open a cell, review the attribution, and record what you will carry.</td></tr>'; return; }
  tb.innerHTML=state.log.slice().reverse().map(l=>`<tr><td>${l.cell}</td><td>${l.tri}</td><td class="num">${f4(l.observed)}</td><td class="num">${l.suggested!=null?f4(l.suggested):'—'}</td><td class="num"><strong>${f4(l.carried)}</strong></td><td>${l.basis}</td><td>${(l.rationale||'').replace(/</g,'&lt;')||'<span class="muted">—</span>'}</td></tr>`).join('');
}
function renderAll(){ renderTabs(); renderTri(); renderFeed(); renderDiag(); renderDrill(); renderLog(); }
document.getElementById('viewFactors').onclick=()=>{state.view='factors';renderAll();};
document.getElementById('viewValues').onclick=()=>{state.view='values';renderAll();};
state.sel={i:AYS.indexOf(2022), d:2};
renderAll();
})();
</script>
